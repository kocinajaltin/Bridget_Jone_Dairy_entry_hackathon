<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="script.js"></script>
</head>

<body>

    <header>
       <b> Bridget Jones Dairy </b>
    </header>

    <main class="container mt-4">

        <section id="welcome">
            <h1>Hello Bridget</h1>
            <h2>Entry your diary entry below</h2>
        </section>

        <section id="create-entry">
            <form>
                <h2>Add a diary entry:</h2>
                <input type="text" name="date" placeholder="Date of entry" required>
                <input type="text" name="title" placeholder="Title of entry">
                <input type="text" name="context" placeholder="Diary entry" required>
                <input type="submit" value="Submit entry" id="button">
            </form>
        </section>

        <section id="search-entries">

        </section>

        <section id="diary-entries">

        </section>

        <section id="view-entry">

        </section>

        <section id="edit-entry">

        </section>

    </main>

    <footer>

    </footer>

</body>
</html>
