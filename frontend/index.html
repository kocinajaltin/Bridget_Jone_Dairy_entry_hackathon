<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="script.js"></script>
</head>

<body style="--bg-image: url('https://static.vecteezy.com/system/resources/thumbnails/071/874/399/small/open-lined-notebook-photo.jpeg');">



    <header>
       <b> Bridget Jones Diary </b>
    </header>

    <main class="container mt-4">

    <section id="welcome" class="w-50 text-center">
        <h1>Hello Bridget</h1>
        <h2>Enter your diary entry below</h2>
    </section>

        <section id="create-entry">
            <form>
                <h2 class="w-50 text-center">Add a diary entry:</h2>
                <label for="date">Date:</label>
                <input type="date" id="date" name="date">
                <input type="text" name="title" placeholder="Title of entry"> <br> <br>
                
                <textarea name="context" placeholder="Diary entry ..." maxlength="2000" rows="15" style="width: 50%;" required></textarea>
                <br>
                <input type="submit" value="Submit entry" id="button">
            </form>
        </section>


        <section id="search-entries">

        </section>

        <section id="diary-entries">

        </section>

        <section id="view-entry">

        </section>

        <section id="edit-entry">

        </section>

    </main>

    <footer>

    </footer>

</body>
</html>
